aid: stoik
name: Stoik
description: >-
  Stoïk is a European cyber-insurtech, founded in 2021 and headquartered in Paris, that
  pairs cyber insurance with active security prevention for small and mid-market businesses
  (up to roughly €1B revenue). Insurance coverage of up to €10M is backed by Tokio Marine
  HCC, Swiss Re and Axeria IARD and sold 100% online through a broker platform used by
  1,500+ partner brokers across France, Germany, Spain, Austria, Belgium and the Netherlands.
  Beyond insurance, Stoïk ships a free risk-monitoring suite — Stoïk Protect (external scan,
  phishing simulation, Active Directory and cloud scanning, leaked-credential monitoring),
  Managed Detection & Response (MDR), and managed email security — plus 24/7 incident
  response. Stoïk is a portfolio company of Andreessen Horowitz (a16z) and Anthemis. No
  public developer API is published today; the developer-adjacent surface is a GitBook help
  center (docs.stoik.io, with an llms.txt index and a dated changelog), the insured/broker
  platform at app.stoik.io, and the GitHub org github.com/stoikio.
